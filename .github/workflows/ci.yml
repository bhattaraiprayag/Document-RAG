name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "backend/.python-version"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test with Pytest
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=63

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint and Build
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run build

  ml-api-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: ml-api
        run: uv sync --dev

      - name: Lint with Ruff
        working-directory: ml-api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test with Pytest
        working-directory: ml-api
        env:
          ML_API_READY_TIMEOUT: "5"
        run: uv run pytest --cov=cache_config --cov-report=term-missing --cov-report=xml --cov-fail-under=90

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, ml-api-quality]
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Check initial disk space
        run: df -h

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: document-rag-backend:latest

      - name: Check disk space after backend
        run: df -h

      - name: Build Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: document-rag-frontend:latest

      - name: Check disk space after frontend
        run: df -h

      - name: Build ML API
        uses: docker/build-push-action@v7
        with:
          context: ./ml-api
          push: false
          tags: document-rag-ml-api:latest

      - name: Check disk space after ml-api
        run: df -h

      - name: Prepare env for optional smoke test
        if: ${{ vars.ENABLE_DOCKER_SMOKE == 'true' }}
        run: cp .env.example .env

      - name: Docker compose smoke test (optional)
        if: ${{ vars.ENABLE_DOCKER_SMOKE == 'true' }}
        run: |
          docker compose up -d --wait --wait-timeout 300
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8001/health
          curl -fsS http://localhost:3000/

      - name: Upload compose logs on smoke failure
        if: ${{ failure() && vars.ENABLE_DOCKER_SMOKE == 'true' }}
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload smoke logs artifact
        if: ${{ failure() && vars.ENABLE_DOCKER_SMOKE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: compose-logs.txt

      - name: Tear down compose stack
        if: ${{ always() && vars.ENABLE_DOCKER_SMOKE == 'true' }}
        run: docker compose down -v
